# Loop Timing Witness — workflow lint configuration

# Every job runs on the GitHub-hosted ubuntu-26.04 runner. The pinned actionlint v1.7.12, its
# newest release, knows the GitHub-hosted labels only up to ubuntu-24.04 and refuses any other
# label it does not know. A label named here is accepted as known.
self-hosted-runner:
  labels:
    - ubuntu-26.04
