# Loop Timing Witness — dependency update proposals

# Covers only the ecosystems that exist here: the hashed Python development
# lock and the commit-pinned workflow actions. A proposal cannot bypass the
# gates: a lock without matching hashes fails `pip install --require-hashes`,
# and a version without a reviewed licence record fails the licence guard.
# New releases wait seven days before a proposal is opened.

version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
