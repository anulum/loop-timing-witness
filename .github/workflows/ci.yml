# Loop Timing Witness — coordinator and stable required gate

name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-policy:
    name: Static analysis and repository policy
    uses: ./.github/workflows/reusable-static-policy.yml
    permissions:
      contents: read # read the repository for analysis
  tests:
    name: Tests with complete coverage
    uses: ./.github/workflows/reusable-tests.yml
    permissions:
      contents: read # read the repository for the test run
  gate:
    name: Required gate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: [static-policy, tests]
    if: always()
    permissions: {}
    steps:
      - name: Fail unless every category succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do
            echo "category result: $result"
            if [ "$result" != "success" ]; then
              echo "required gate: a category did not succeed"
              exit 1
            fi
          done
