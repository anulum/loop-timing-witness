# Loop Timing Witness — native comparison measurement and retained runner receipt

name: Controller comparison

on:
  workflow_dispatch:
  schedule:
    - cron: "23 4 * * 1"

permissions: {}

concurrency:
  group: controller-comparison-${{ github.ref }}
  cancel-in-progress: true

jobs:
  measure:
    name: Native controller comparison on the fixed runner
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read # read benchmark sources, without repository write authority
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13.15"
      - name: Install the hashed development lock and repository package
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --require-hashes --no-deps -r requirements-dev.txt
          .venv/bin/python -m pip install --no-index --no-build-isolation --no-deps -e .
      - name: Install the pinned Rust toolchain
        run: |
          rustup toolchain install 1.99.0 --profile minimal --component rustfmt --component clippy
          rustup default 1.99.0
      - name: Build both actual native benchmark programs
        run: make controller-build
      - name: Measure both backends and retain runner context
        run: |
          .venv/bin/python - <<'PY'
          import hashlib
          import json
          import os
          import pathlib
          import subprocess
          import sys

          subprocess.run(
              [sys.executable, "tools/benchmark_controllers.py",
               "--output", "build/controller_comparison.ci.json",
               "--cpu", str(min(os.sched_getaffinity(0)))],
              check=True, timeout=120,
          )
          keys = ("GITHUB_SERVER_URL", "GITHUB_REPOSITORY", "GITHUB_RUN_ID",
                  "GITHUB_RUN_ATTEMPT", "GITHUB_SHA", "GITHUB_REF",
                  "RUNNER_OS", "RUNNER_ARCH", "RUNNER_ENVIRONMENT")
          receipt = {key: os.environ[key] for key in keys}
          artifact = pathlib.Path("build/controller_comparison.ci.json").read_bytes()
          if json.loads(artifact)["base_commit"] != receipt["GITHUB_SHA"]:
              raise ValueError("benchmark commit differs from the hosted run")
          receipt["artifact_sha256"] = hashlib.sha256(artifact).hexdigest()
          pathlib.Path("build/controller_comparison.runner.json").write_text(
              json.dumps(receipt, sort_keys=True, indent=2) + "\n", encoding="utf-8",
          )
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: controller-comparison-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/controller_comparison.ci.json
            build/controller_comparison.runner.json
          retention-days: 30
          if-no-files-found: error
