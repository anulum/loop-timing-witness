# Loop Timing Witness — bounded continuous fuzzing of the public controller API

name: Controller fuzzing

on:
  push:
  pull_request:
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: controller-fuzz-${{ github.ref }}
  cancel-in-progress: true

jobs:
  campaign:
    name: Coverage-guided sanitizer campaign of the public C controller
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read # read the controller, the fuzz target and the committed seeds
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned fuzzing compiler and sanitizer runtime
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes clang-18=1:18.1.3-1ubuntu1 libclang-rt-18-dev=1:18.1.3-1ubuntu1 libstdc++-13-dev
          clang-18 --version
      - name: Restore the corpus grown by earlier clean runs of the default branch
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/fuzz/corpus
          key: controller-fuzz-corpus-${{ github.run_id }}
          restore-keys: controller-fuzz-corpus-
      - name: Run the bounded campaign
        env:
          FUZZ_SECONDS: ${{ github.event_name == 'schedule' && '900' || '120' }}
        run: make controller-fuzz FUZZ_SECONDS="$FUZZ_SECONDS"
      - name: Retain the engine log and every crash input
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: controller-fuzz
          path: |
            build/fuzz/run.log
            build/fuzz/crashes
          retention-days: 30
          if-no-files-found: error
      - name: Save the grown corpus after a clean run of the default branch
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/fuzz/corpus
          key: controller-fuzz-corpus-${{ github.run_id }}
