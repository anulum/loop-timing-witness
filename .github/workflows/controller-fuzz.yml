# Loop Timing Witness — bounded continuous fuzzing of the public controller API

name: Controller fuzzing

on:
  push:
  pull_request:
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: controller-fuzz-${{ github.ref }}
  cancel-in-progress: true

jobs:
  campaign:
    name: Coverage-guided sanitizer campaign of the public C controller
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read # read the controller, the fuzz target and the committed seeds
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned fuzzing compiler and sanitizer runtime
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes clang-21=1:21.1.8-6ubuntu1 libclang-rt-21-dev=1:21.1.8-6ubuntu1 libstdc++-15-dev=15.2.0-16ubuntu1
          clang-21 --version
      - name: Restore the corpus grown by earlier clean runs of the default branch
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/fuzz/corpus
          key: controller-fuzz-corpus-${{ github.run_id }}
          restore-keys: controller-fuzz-corpus-
      - name: Run the bounded campaign
        env:
          FUZZ_SECONDS: ${{ github.event_name == 'schedule' && '900' || '120' }}
        run: make controller-fuzz FUZZ_SECONDS="$FUZZ_SECONDS"
      - name: Retain the engine log and every crash input
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: controller-fuzz
          path: |
            build/fuzz/run.log
            build/fuzz/crashes
          retention-days: 30
          if-no-files-found: error
      - name: Save the grown corpus after a clean run of the default branch
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/fuzz/corpus
          key: controller-fuzz-corpus-${{ github.run_id }}

  run-inputs:
    name: Differential mutation campaign of the run input readers
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    permissions:
      contents: read # read the readers, the capture logic and the fuzz test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15.2"
      - name: Install the pinned capture simulator
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes iverilog=12.0-3
          iverilog -V 2>&1 | head -1
      - name: Install the pinned Rust toolchain
        # Runners can carry a partial 1.100.0 that conflicts with a component install.
        run: |
          rustup toolchain uninstall 1.100.0
          rustup toolchain install 1.100.0 --profile minimal
          rustup default 1.100.0
      - name: Install the hashed development lock
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --require-hashes --no-deps -r requirements-build.txt
          PYYAML_FORCE_LIBYAML=0 .venv/bin/python -m pip install --require-hashes --no-deps --no-build-isolation -r requirements-dev.txt
          .venv/bin/python -m pip install --no-index --no-build-isolation --no-deps -e .
      - name: Fetch exact native analysis dependencies
        run: cargo fetch --locked --manifest-path analysis/rust/Cargo.toml
      - name: Run the bounded campaign
        env:
          WITNESS_FUZZ_CASES: ${{ github.event_name == 'schedule' && '5000' || '200' }}
          WITNESS_FUZZ_SEED: ${{ github.event_name == 'schedule' && github.run_id || 'push' }}
          WITNESS_FUZZ_ARTIFACTS: build/run-input-fuzz
        run: |
          mkdir -p "$WITNESS_FUZZ_ARTIFACTS"
          echo "seed $WITNESS_FUZZ_SEED, $WITNESS_FUZZ_CASES cases per profile"
          .venv/bin/pytest -q -p no:cacheprovider --no-cov -rf tests/test_run_input_fuzz.py
      - name: Retain the inputs of every differing case
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: run-input-fuzz
          path: build/run-input-fuzz
          retention-days: 30
          if-no-files-found: warn
