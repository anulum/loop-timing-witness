# Loop Timing Witness — documentation validation without deployment

name: Docs

on:
  push:
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Documentation links, anchors and rendered headers
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read # read the documentation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13.15"
      - name: Relative links and heading anchors
        run: python tools/check_documentation.py
      - name: Rendered Markdown starts with content
        run: python tools/check_provenance_headers.py
