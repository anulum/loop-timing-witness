# Loop Timing Witness — pre-commit parity

name: Pre-commit

on:
  push:
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: pre-commit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre-commit:
    name: Repository pre-commit hooks on all files
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read # read the repository for the hooks
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13.15"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.1"
          cache: false
      - name: Install the pinned Rust toolchain
        run: |
          rustup toolchain install 1.99.0 --profile minimal --component rustfmt --component clippy
          rustup default 1.99.0
      - name: Install the pinned native formatter
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes clang-format-18=1:18.1.3-1ubuntu1
          clang-format-18 --version
      - name: Native toolchain versions
        run: |
          gcc --version
          rustc --version
          cargo --version
      - name: Install the hashed development lock
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --require-hashes --no-deps -r requirements-dev.txt
          .venv/bin/python -m pip install --no-index --no-build-isolation --no-deps -e .
      - name: Build pinned Go tools (module checksums verified by the Go checksum database)
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - name: Run every pre-commit stage hook on all files
        run: |
          PATH="$(go env GOPATH)/bin:${PATH}" .venv/bin/pre-commit run --all-files --show-diff-on-failure
