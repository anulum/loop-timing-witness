# Loop Timing Witness — verified Python package publication

name: Publish Python package

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: pypi-publication
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    name: Verify revision and build Python artifacts
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read # read the exact source revision
      actions: read # verify completed validation at the same source revision
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13.15"
      - name: Require green validation at this exact source revision
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method GET "repos/$GITHUB_REPOSITORY/actions/runs" \
            -f head_sha="$GITHUB_SHA" -f branch=main -f per_page=100 > validation-runs.json
          python - <<'PY'
          import json, os
          required = {"CI", "Pre-commit", "CodeQL", "Security audit", "Docs", "SBOM", "Scorecard"}
          runs = json.load(open("validation-runs.json", encoding="utf-8"))["workflow_runs"]
          for name in sorted(required):
              matching = [r for r in runs if r["name"] == name and r["head_sha"] == os.environ["GITHUB_SHA"]]
              if not matching:
                  raise SystemExit(f"Missing exact-revision validation: {name}")
              latest = max(matching, key=lambda r: (r["id"], r["run_attempt"]))
              if latest["status"] != "completed" or latest["conclusion"] != "success":
                  raise SystemExit(f"Validation is not green: {name}")
              print(f"Verified {name}: {latest['html_url']}")
          PY
      - name: Install the exact build and consumer toolchains
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes iverilog=12.0-2build2
          python -m venv .venv
          .venv/bin/python -m pip install --require-hashes --no-deps -r requirements-dev.txt
          .venv/bin/python -m pip install --no-index --no-build-isolation --no-deps -e .
          make python-wheelhouse
      - name: Exercise actual wheel and source-archive consumers with real RTL
        run: .venv/bin/pytest tests/test_python_distribution.py
      - name: Build the wheel and source archive from the verified checkout
        run: |
          mkdir dist
          .venv/bin/python - <<'PY'
          from flit_core.buildapi import build_sdist, build_wheel
          print(build_wheel("dist"))
          print(build_sdist("dist"))
          PY
          sha256sum dist/*
      - name: Retain the exact verified distribution artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 30
  publish:
    if: github.ref == 'refs/heads/main'
    name: Publish via the project-bound PyPI identity
    needs: [build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      id-token: write # exchange this exact repository/workflow/environment identity with PyPI
    environment:
      name: pypi
      url: https://pypi.org/project/loop-timing-witness/
    steps:
      - name: Download only the artifacts verified by this workflow run
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-distributions
          path: dist/
      - name: Publish the distributions with OIDC attestations
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
