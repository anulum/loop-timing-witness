# Loop Timing Witness — static analysis and repository policy (reusable)

name: Static analysis and repository policy

on:
  workflow_call:

permissions: {}

jobs:
  run:
    name: Lint, typing, manifest, inventory and repository guards
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read # read the repository for analysis
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13.15"
      - name: Install the pinned Rust toolchain
        run: |
          rustup toolchain install 1.99.0 --profile minimal --component rustfmt --component clippy
          rustup default 1.99.0
      - name: Install the pinned native formatter
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes clang-format-18=1:18.1.3-1ubuntu1
          clang-format-18 --version
      - name: Native toolchain versions
        run: |
          gcc --version
          rustc --version
          cargo --version
      - name: Install the hashed development lock
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --require-hashes --no-deps -r requirements-dev.txt
          .venv/bin/python -m pip install --no-index --no-build-isolation --no-deps -e .
      - name: Native controller build and strict checks
        run: make controller-build
      - name: Ruff lint
        run: .venv/bin/ruff check .
      - name: Ruff format
        run: .venv/bin/ruff format --check .
      - name: Mypy strict
        run: .venv/bin/mypy
      - name: Maintained source enrolment
        run: .venv/bin/python tools/check_source_gates.py
      - name: Maintained C and C++ formatting
        run: .venv/bin/python tools/check_native_format.py
      - name: Measurement-domain manifest
        run: .venv/bin/python tools/validate_measurement_domain.py
      - name: Capability inventory drift
        run: .venv/bin/python tools/generate_capability_inventory.py --check
      - name: Provenance headers
        run: .venv/bin/python tools/check_provenance_headers.py
      - name: Development dependency licences
        run: .venv/bin/python tools/check_dependency_licences.py
      - name: Workflow policy
        run: .venv/bin/python tools/audit_workflows.py
