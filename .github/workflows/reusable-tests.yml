# Loop Timing Witness — sharded tests with complete Python and native coverage (reusable)

name: Tests with complete coverage

on:
  workflow_call:

permissions: {}

jobs:
  plan:
    name: Plan duration-balanced test shards
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read # read the repository and its test inventory
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13.15"
      - name: Install the hashed development lock
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --require-hashes --no-deps -r requirements-dev.txt
      - name: Restore the latest measured module durations
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/pytest-timings/timings.json
          key: pytest-module-timings-${{ github.sha }}
          restore-keys: pytest-module-timings-
      - name: Assign every discovered test module to exactly one shard
        run: .venv/bin/python tools/pytest_shards.py plan --count 4 --timings build/pytest-timings/timings.json --output build/pytest-plan
      - name: Retain the plan for every shard and the aggregate
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pytest-plan-${{ github.sha }}
          path: build/pytest-plan
          if-no-files-found: error
          retention-days: 7
  native:
    name: Instrumented native analysis tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read # read the repository for the instrumented native build
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/build/native-target
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchain with its LLVM tools
        run: |
          rustup toolchain install 1.99.0 --profile minimal --component llvm-tools-preview
          rustup default 1.99.0
      - name: Fetch exact native analysis dependencies
        run: cargo fetch --locked --manifest-path analysis/rust/Cargo.toml
      - name: Build every native analysis test once with branch coverage instrumentation
        env:
          RUSTC_BOOTSTRAP: "1"
          RUSTFLAGS: -C instrument-coverage -Z coverage-options=branch
          CARGO_PROFILE_DEV_DEBUG: "0"
          # Instrumented procedural macros write profiles while compiling; they are not tests.
          LLVM_PROFILE_FILE: ${{ github.workspace }}/build/native-build-profiles/build-%p-%m.profraw
        run: |
          mkdir -p build/native-analysis/bin build/native-analysis/profiles
          cargo test --offline --locked --manifest-path analysis/rust/Cargo.toml --no-run --message-format=json \
            | jq -r 'select(.reason == "compiler-artifact" and .executable != null) | .executable' \
            | sort -u > build/native-executables.txt
          test -s build/native-executables.txt
          while read -r executable; do cp "$executable" build/native-analysis/bin/; done < build/native-executables.txt
      - name: Run every instrumented native analysis test
        working-directory: analysis/rust
        env:
          LLVM_PROFILE_FILE: ${{ github.workspace }}/build/native-analysis/profiles/native-%p-%m.profraw
        run: |
          # Test harnesses live under deps; the installed command is run by its own tests.
          grep '/deps/' "$GITHUB_WORKSPACE/build/native-executables.txt" | while read -r executable; do
            "$executable" --test-threads=2
          done
          test -n "$(ls "$GITHUB_WORKSPACE"/build/native-analysis/profiles)"
      - name: Retain the instrumented tests and their profiles for the shards and the union
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-analysis-${{ github.sha }}
          path: build/native-analysis
          if-no-files-found: error
          retention-days: 7
  shard:
    name: Pytest shard ${{ matrix.shard }} of 4
    needs: [plan, native]
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      WITNESS_RV64_CC: /usr/bin/riscv64-linux-gnu-gcc-13
      WITNESS_SPIKE_SOURCE: ${{ github.workspace }}/build/amp-ci/spike-source
      WITNESS_SPIKE_BUILD: ${{ github.workspace }}/build/amp-ci/spike-build
      WITNESS_SPIKE: ${{ github.workspace }}/build/amp-ci/spike-build/spike
      WITNESS_SPIKE_PLUGIN: ${{ github.workspace }}/build/amp-ci/mechanical/witness_spike_axi.so
      WITNESS_SPIKE_THERMAL_PLUGIN: ${{ github.workspace }}/build/amp-ci/thermal/witness_spike_axi.so
      WITNESS_AMP_IMAGE: ${{ github.workspace }}/build/amp-ci/image
    permissions:
      contents: read # read the repository for the test run
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13.15"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.1"
          cache: false
      - name: Install pinned RTL, RV64, device-tree, Spike and native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes clang-format-18=1:18.1.3-1ubuntu1
          clang-format-18 --version
          sudo apt-get install --no-install-recommends --yes clang-18=1:18.1.3-1ubuntu1 libclang-rt-18-dev=1:18.1.3-1ubuntu1 libstdc++-13-dev
          clang-18 --version
          clang++-18 --version
          sudo apt-get install --no-install-recommends --yes iverilog=12.0-2build2 verilator=5.020-1 yosys=0.33-5build2 libssl-dev=3.0.13-0ubuntu3.16 libssl3t64=3.0.13-0ubuntu3.16 strace=6.8-0ubuntu2
          sudo apt-get install --no-install-recommends --yes \
            device-tree-compiler=1.7.0-2build1 gcc-riscv64-linux-gnu=4:13.2.0-7ubuntu1 \
            gcc-13-riscv64-linux-gnu=13.3.0-6ubuntu2~24.04.1cross1 \
            libboost-regex-dev=1.83.0.1ubuntu2 libboost-system-dev=1.83.0.1ubuntu2 \
            libboost1.83-dev=1.83.0-2.1ubuntu3.2 libboost-regex1.83-dev=1.83.0-2.1ubuntu3.2 \
            libboost-system1.83-dev=1.83.0-2.1ubuntu3.2 libboost-regex1.83.0=1.83.0-2.1ubuntu3.2 \
            libboost-system1.83.0=1.83.0-2.1ubuntu3.2
          dpkg-query -W iverilog verilator yosys libssl-dev libssl3t64 strace device-tree-compiler 'gcc*' 'binutils*' 'libboost*'
          strace --version
          verilator --version
          yosys -V
          iverilog -V
          vvp -V
          dtc --version
          "$WITNESS_RV64_CC" --version
      - name: Install the pinned Rust toolchain
        run: |
          rustup toolchain install 1.99.0 --profile minimal --component rustfmt --component clippy --component llvm-tools-preview --target wasm32-unknown-unknown --target riscv64imac-unknown-none-elf
          rustup default 1.99.0
      - name: Native toolchain versions
        run: |
          gcc --version
          rustc --version
          cargo --version
      - name: Install the pinned native inventory generator used by its owning tests
        run: cargo install cargo-cyclonedx --version 0.5.9 --locked
      - name: Install the hashed development lock
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --require-hashes --no-deps -r requirements-dev.txt
          .venv/bin/python -m pip install --no-index --no-build-isolation --no-deps -e .
      - name: Prepare hash-verified wheels for isolated Python package consumers
        run: make python-wheelhouse
      - name: Rust core and C ABI source coverage with matching LLVM tools
        if: matrix.shard == 1
        run: .venv/bin/pytest -q tests/test_amp_rust_branch_coverage.py
      - name: Identify every Spike build input
        id: spike-key
        run: |
          compiler="$(gcc --version | head -n 1; g++ --version | head -n 1)"
          printf 'key=spike-%s-%s-%s\n' "$ImageOS" \
            "$(printf '%s' "$compiler" | sha256sum | cut -c 1-16)" \
            "$(sha256sum .github/workflows/reusable-tests.yml | cut -c 1-64)" >> "$GITHUB_OUTPUT"
      - name: Restore the exact Spike build
        id: spike-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/amp-ci/spike-*
          key: ${{ steps.spike-key.outputs.key }}
      - name: Build the exact original Spike simulator and SDK
        if: steps.spike-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$WITNESS_SPIKE_SOURCE" "$WITNESS_SPIKE_BUILD"
          git -C "$WITNESS_SPIKE_SOURCE" init
          git -C "$WITNESS_SPIKE_SOURCE" remote add origin https://github.com/riscv-software-src/riscv-isa-sim.git
          git -C "$WITNESS_SPIKE_SOURCE" fetch --depth 1 origin 7ab2efd6785e847c6d13d810c0b25b7c9c26bd21
          git -C "$WITNESS_SPIKE_SOURCE" checkout --detach 7ab2efd6785e847c6d13d810c0b25b7c9c26bd21
          cd "$WITNESS_SPIKE_SOURCE"
          # Import Boost before Spike's yield() instruction macro; preserve the diff in receipts.
          printf '%s\n' '2000de3a282d863b7d8e5a2a010292f224350576cd2e2ba947aa3a3aa8ff29c1  riscv/interactive.cc' | sha256sum --check --strict
          sed -i '/#include "socketif.h"/d; /#include "decode.h"/a #include "socketif.h"' riscv/interactive.cc
          printf '%s\n' 'a8bcc40fe376e5bc0fea16fba5b0a7d1cc6e63f667f511b98ac67d9e04c3f622  riscv/interactive.cc' | sha256sum --check --strict
          git diff --exit-code -- . ':!riscv/interactive.cc'
          git diff -- riscv/interactive.cc
          cd "$WITNESS_SPIKE_BUILD"
          "$WITNESS_SPIKE_SOURCE/configure" --prefix="$WITNESS_SPIKE_BUILD/install"
          make -j2 spike
          "$WITNESS_SPIKE" --help
      - name: Retain the exact Spike build for later runs
        if: matrix.shard == 1 && steps.spike-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/amp-ci/spike-*
          key: ${{ steps.spike-key.outputs.key }}
      - name: Check the restored or built Spike simulator
        run: |
          "$WITNESS_SPIKE" --help
      - name: Build the actual RV64 firmware and both production RTL plugins
        run: |
          dtc -I dts -O dtb -o build/amp-ci/platform.dtb tests/platforms/spike_multihart.dts
          printf '%s\n' 'pid 10 32768 16777216 0 0 0 16777216 0 16777216 -16777216 16777216 -16777216 16777216 0 16777216 0 0 0 none 0 0 0 0' > build/amp-ci/configuration.txt
          .venv/bin/python tools/prepare_amp_image.py \
            --dtb build/amp-ci/platform.dtb --configuration build/amp-ci/configuration.txt \
            --ram-node /memory@80000000 --firmware-node /reserved-memory/firmware@80000000 \
            --telemetry-node /reserved-memory/telemetry@80080000 --device-node /witness@40000000 \
            --plic-node /soc/plic@c000000 --plic-layout spike --hart 2 --interrupt 2 \
            --stack-bytes 16384 --output "$WITNESS_AMP_IMAGE" --compiler "$WITNESS_RV64_CC" --isa
          make -C "$WITNESS_AMP_IMAGE" -j2
          make amp-spike-plugin AMP_SPIKE_SOURCE="$WITNESS_SPIKE_SOURCE" AMP_SPIKE_BUILD="$WITNESS_SPIKE_BUILD" AMP_PLUGIN_DIRECTORY=build/amp-ci/mechanical SIMULATION_THERMAL=0
          make amp-spike-plugin AMP_SPIKE_SOURCE="$WITNESS_SPIKE_SOURCE" AMP_SPIKE_BUILD="$WITNESS_SPIKE_BUILD" AMP_PLUGIN_DIRECTORY=build/amp-ci/thermal SIMULATION_THERMAL=1
      - name: Build pinned Go tools used by the gate-runner tests
        run: |
          go install github.com/zricethezav/gitleaks/v8@v8.30.1
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - name: Native controller public API tests
        if: matrix.shard == 2
        run: make controller-tests
      - name: Native Linux UIO adapter build
        run: make run-uio
      - name: Fetch exact native analysis dependencies
        run: cargo fetch --locked --manifest-path analysis/rust/Cargo.toml
      - name: Build strict documentation references used by website tests
        run: make documentation-toolchain native-api
      - name: Download the run's shard plan
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pytest-plan-${{ github.sha }}
          path: build/pytest-plan
      - name: Download the instrumented native analysis tests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: native-analysis-${{ github.sha }}
          path: build/native-analysis
      - name: Tests with coverage in this shard
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          mkdir -p build/coverage/native-profiles
          # Parity tests run the one instrumented registry consumer and keep its profiles.
          consumers=(build/native-analysis/bin/registry_consumer-*)
          test "${#consumers[@]}" -eq 1
          chmod +x "${consumers[0]}"
          export WITNESS_RUST_REGISTRY_CONSUMER="$PWD/${consumers[0]}"
          export WITNESS_RUST_PROFILE_DIRECTORY="$PWD/build/coverage/native-profiles"
          mapfile -t modules < "build/pytest-plan/shard-${SHARD}.txt"
          test "${#modules[@]}" -gt 0
          cp "build/pytest-plan/shard-${SHARD}.txt" "build/coverage/shard-${SHARD}.txt"
          # The complete threshold applies once to the union in the aggregate job.
          PATH="$(go env GOPATH)/bin:${PATH}" COVERAGE_FILE="build/coverage/shard-${SHARD}.coverage" \
            .venv/bin/pytest --cov --cov-branch --cov-report= --cov-fail-under=0 \
            --junitxml="build/coverage/junit-${SHARD}.xml" "${modules[@]}"
      - name: Retain this shard's coverage, timing and module list
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pytest-shard-${{ matrix.shard }}-${{ github.sha }}
          path: |
            build/coverage/shard-${{ matrix.shard }}.coverage
            build/coverage/shard-${{ matrix.shard }}.txt
            build/coverage/junit-${{ matrix.shard }}.xml
            build/coverage/native-profiles
          if-no-files-found: error
          retention-days: 7
  run:
    name: Pytest with 100 % statement and branch coverage
    needs: [plan, native, shard]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read # read the repository for the coverage union
    steps:
      - name: Require the plan, the native tests and every shard to succeed
        env:
          PLAN: ${{ needs.plan.result }}
          NATIVE: ${{ needs.native.result }}
          SHARDS: ${{ needs.shard.result }}
        run: |
          echo "plan: $PLAN; native: $NATIVE; shards: $SHARDS"
          test "$PLAN" = success
          test "$NATIVE" = success
          test "$SHARDS" = success
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13.15"
      - name: Install the hashed development lock
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --require-hashes --no-deps -r requirements-dev.txt
          .venv/bin/python -m pip install --no-index --no-build-isolation --no-deps -e .
      - name: Download the run's shard plan
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pytest-plan-${{ github.sha }}
          path: build/pytest-plan
      - name: Download every shard's results
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: pytest-shard-*-${{ github.sha }}
          path: build/shards
      - name: Verify that the shards ran the complete inventory exactly once
        run: |
          mkdir build/executed
          cp build/pytest-plan/inventory.txt build/executed/
          for index in 1 2 3 4; do
            cmp "build/pytest-plan/shard-${index}.txt" "build/shards/pytest-shard-${index}-${GITHUB_SHA}/shard-${index}.txt"
            cp "build/shards/pytest-shard-${index}-${GITHUB_SHA}/shard-${index}.txt" build/executed/
          done
          .venv/bin/python tools/pytest_shards.py verify --plan build/executed --count 4
      - name: Combine all shards and apply the complete threshold once
        run: |
          .venv/bin/coverage combine --keep \
            build/shards/pytest-shard-1-"$GITHUB_SHA"/shard-1.coverage \
            build/shards/pytest-shard-2-"$GITHUB_SHA"/shard-2.coverage \
            build/shards/pytest-shard-3-"$GITHUB_SHA"/shard-3.coverage \
            build/shards/pytest-shard-4-"$GITHUB_SHA"/shard-4.coverage
          .venv/bin/coverage report --show-missing --fail-under=100
          mkdir -p build/coverage
          .venv/bin/python tools/export_python_coverage.py build/coverage/coverage.xml
      - name: Install the pinned Rust toolchain with its LLVM tools
        run: |
          rustup toolchain install 1.99.0 --profile minimal --component llvm-tools-preview
          rustup default 1.99.0
      - name: Download the instrumented native analysis tests and their profiles
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: native-analysis-${{ github.sha }}
          path: build/native-analysis
      - name: Merge every native profile and require complete native coverage
        run: |
          tools="$(rustc --print sysroot)/lib/rustlib/x86_64-unknown-linux-gnu/bin"
          mkdir -p build/native-coverage
          find build/native-analysis/profiles build/shards -name '*.profraw' | sort > build/native-coverage/profiles.txt
          test -s build/native-coverage/profiles.txt
          "$tools/llvm-profdata" merge -sparse --input-files=build/native-coverage/profiles.txt \
            -o build/native-coverage/merged.profdata
          mapfile -t binaries < <(find build/native-analysis/bin -type f | sort)
          objects=()
          for binary in "${binaries[@]:1}"; do objects+=("-object=$binary"); done
          "$tools/llvm-cov" export -summary-only "${binaries[0]}" "${objects[@]}" \
            -instr-profile=build/native-coverage/merged.profdata "$PWD/analysis/rust/src" \
            > build/native-coverage/summary.json
          .venv/bin/python tools/rust_coverage_gate.py --crate analysis/rust \
            --summary build/native-coverage/summary.json
      - name: Retain the native coverage summary
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-coverage-${{ github.sha }}
          path: build/native-coverage/summary.json
          if-no-files-found: error
          retention-days: 7
      - name: Bind the Python report to the tested source
        run: |
          printf '%s\n' "$GITHUB_SHA" > build/coverage/source-revision.txt
          sha256sum build/coverage/coverage.xml | cut -d ' ' -f 1 > build/coverage/coverage.sha256
      - name: Retain the successful Python coverage report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-coverage-${{ github.sha }}
          path: |
            build/coverage/coverage.xml
            build/coverage/coverage.sha256
            build/coverage/source-revision.txt
          if-no-files-found: error
          retention-days: 7
      - name: Record the measured module durations for later plans
        run: |
          mkdir -p build/pytest-timings
          .venv/bin/python tools/pytest_shards.py record --reports build/shards \
            --previous build/pytest-plan/timings.json --output build/pytest-timings/timings.json
      - name: Retain the durations measured on main
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/pytest-timings/timings.json
          key: pytest-module-timings-${{ github.run_id }}-${{ github.run_attempt }}
  coverage:
    name: Publish the verified Python report to Codecov
    needs: [run]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: codecov
    permissions:
      contents: read # read exactly the tested source
      id-token: write # authenticate only the main-branch coverage upload
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Download the report from this workflow run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-coverage-${{ github.sha }}
          path: build/coverage
      - name: Verify the tested revision and report digest
        run: |
          test "$(cat build/coverage/source-revision.txt)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(sha256sum build/coverage/coverage.xml | cut -d ' ' -f 1)" = "$(cat build/coverage/coverage.sha256)"
      - name: Upload only the verified Python report
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: build/coverage/coverage.xml
          flags: python
          disable_search: true
          disable_file_fixes: true
          use_oidc: true
          version: v11.3.1
          override_commit: ${{ github.sha }}
          fail_ci_if_error: true
