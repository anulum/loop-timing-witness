# Loop Timing Witness — tests with complete coverage (reusable)

name: Tests with complete coverage

on:
  workflow_call:

permissions: {}

jobs:
  run:
    name: Pytest with 100 % statement and branch coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read # read the repository for the test run
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13.15"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.1"
          cache: false
      - name: Install the pinned Ubuntu RTL simulator
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes iverilog=12.0-2build2
          iverilog -V
          vvp -V
      - name: Install the pinned Rust toolchain
        run: |
          rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy
          rustup default 1.98.1
      - name: Native toolchain versions
        run: |
          gcc --version
          rustc --version
          cargo --version
      - name: Install the hashed development lock
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --require-hashes --no-deps -r requirements-dev.txt
      - name: Build pinned Go tools used by the gate-runner tests
        run: |
          go install github.com/zricethezav/gitleaks/v8@v8.30.1
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - name: Native controller public API tests
        run: make controller-tests
      - name: Tests with coverage
        run: |
          PATH="$(go env GOPATH)/bin:${PATH}" .venv/bin/pytest --cov --cov-branch --cov-report=term-missing --cov-fail-under=100
