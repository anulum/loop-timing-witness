# Loop Timing Witness — software inventory of the development lock (no release)

name: SBOM

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: sbom-${{ github.ref }}
  cancel-in-progress: true

jobs:
  inventory:
    name: CycloneDX inventory of the hashed development lock
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read # read the lock file
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13.15"
      - name: Install the hashed development lock
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --require-hashes --no-deps -r requirements-dev.txt
          .venv/bin/python -m pip install --no-index --no-build-isolation --no-deps -e .
      - name: Generate the CycloneDX document
        run: |
          .venv/bin/cyclonedx-py requirements requirements-dev.txt --output-file sbom.cdx.json
          .venv/bin/cyclonedx-py requirements requirements-runtime.txt --output-file runtime-sbom.cdx.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-cyclonedx
          path: |
            sbom.cdx.json
            runtime-sbom.cdx.json
          retention-days: 30
          if-no-files-found: error
