# Loop Timing Witness — locked Python and native dependency inventories

name: SBOM

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: sbom-${{ github.ref }}
  cancel-in-progress: true

jobs:
  inventory:
    name: CycloneDX inventories of Python and native dependency locks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read # read the lock file
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13.15"
      - name: Install the hashed development lock
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --require-hashes --no-deps -r requirements-dev.txt
          .venv/bin/python -m pip install --no-index --no-build-isolation --no-deps -e .
      - name: Generate the CycloneDX document
        run: |
          .venv/bin/cyclonedx-py requirements requirements-dev.txt --output-file sbom.cdx.json
          .venv/bin/cyclonedx-py requirements requirements-runtime.txt --output-file runtime-sbom.cdx.json
      - name: Install the pinned native inventory generator
        run: |
          rustup toolchain install 1.99.0 --profile minimal
          rustup default 1.99.0
          cargo install cargo-cyclonedx --version 0.5.9 --locked
      - name: Fetch exact native analysis dependencies
        run: cargo fetch --locked --manifest-path analysis/rust/Cargo.toml
      - name: Generate and verify the complete native dependency inventory
        run: make native-sbom
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-cyclonedx
          path: |
            sbom.cdx.json
            runtime-sbom.cdx.json
            build/native-analysis-sbom/native-analysis-sbom.cdx.json
          retention-days: 30
          if-no-files-found: error
