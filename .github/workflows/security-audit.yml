# Loop Timing Witness — secrets, dependency, licence and workflow security audit

name: Security audit

on:
  push:
  pull_request:
  schedule:
    - cron: "41 5 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: security-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Secrets, vulnerabilities, licences and workflow security
    uses: ./.github/workflows/reusable-security-audit.yml
    permissions:
      contents: read # read the repository and its history for the scans
