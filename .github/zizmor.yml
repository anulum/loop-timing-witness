# Loop Timing Witness — workflow security analysis configuration

# Every audit runs with the pedantic persona except the one below.
rules:
  # self-repository suggests the `$/` form for same-repository reusable
  # workflow calls. The pinned actionlint v1.7.12 rejects that form as an
  # invalid reusable workflow reference, while the `./.github/workflows/` form
  # is valid for both tools and for the hosted runner. Re-enable this audit
  # when the pinned actionlint accepts `$/`.
  self-repository:
    disable: true
