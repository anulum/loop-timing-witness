# Loop Timing Witness — controllers/rust/Cargo.toml

[package]
name = "witness-controller"
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
publish = false
license = "AGPL-3.0-or-later"
description = "Bit-exact Q8.24 PID and discrete LQR for Loop Timing Witness"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"

[lints.clippy]
all = "deny"

[profile.release]
overflow-checks = true
opt-level = 3
lto = "fat"
codegen-units = 1
