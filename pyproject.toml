# Loop Timing Witness — package and validation tooling configuration

# Python distribution metadata describes software interfaces; it does not
# claim board measurements or physical acceptance.

[build-system]
requires = ["flit_core==4.1.0"]
build-backend = "flit_core.buildapi"

[project]
name = "loop-timing-witness"
version = "0.1.0"
description = "Timing, tracking and power analysis for Loop Timing Witness"
requires-python = ">=3.13"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
readme = "README.md"
authors = [{name = "Miroslav Šotek", email = "protoscience@anulum.li"}]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Typing :: Typed",
]
dependencies = ["jsonschema==4.26.0"]

[project.scripts]
loop-timing-witness-analyze = "loop_timing_witness.analyze_run:main"

[project.urls]
Homepage = "https://github.com/anulum/loop-timing-witness"
Repository = "https://github.com/anulum/loop-timing-witness"
Documentation = "https://anulum.github.io/loop-timing-witness/"
Issues = "https://github.com/anulum/loop-timing-witness/issues"
Changelog = "https://github.com/anulum/loop-timing-witness/blob/main/CHANGELOG.md"
Security = "https://github.com/anulum/loop-timing-witness/security/policy"

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = ["docs/internal"]

[tool.ruff.lint]
select = ["ALL"]
# The provenance header uses an en dash in the copyright ranges and an em dash
# in the title line; both are the mandated header text.
allowed-confusables = ["–", "—"]
# Every rule is enabled. Each rule below is off for a stated reason that holds
# for this repository, not for convenience.
ignore = [
    # COM812 conflicts with the formatter's trailing-comma handling; the
    # formatter is authoritative.
    "COM812",
    # TRY003 asks for short exception messages defined on exception classes.
    # Every refusal here names the offending field, file or value, and that
    # message is the evidence the caller acts on.
    "TRY003",
    # T201 forbids print. The tools are command-line programs whose contract
    # is their standard output and error streams.
    "T201",
    # TRY004 asks for TypeError when a decoded document has the wrong shape.
    # Such a document is invalid data supplied by a file, not a programming
    # error in the caller, so the tools report it as ValueError.
    "TRY004",
    # ERA001 reads line 6 of the mandated provenance header ("Contact: ...")
    # as commented-out code in every file, and a rule cannot be scoped to one
    # line without a suppression comment, which the repository forbids.
    "ERA001",
    # INP001 asks for __init__.py files. tools/ holds stand-alone scripts run
    # as `python tools/<name>.py` and tests/ is collected by pytest; neither is
    # an importable package, and making them packages would change how the
    # scripts resolve their sibling modules.
    "INP001",
]

[tool.ruff.lint.per-file-ignores]
# assert is the pytest contract surface; tests run the repository's own
# command-line tools and Git with fixed argument vectors and no shell; the
# literal numbers in assertions (exit statuses, counts) are the specification
# under test, and naming each one would hide it from the assertion.
"tests/*" = ["S101", "S603", "S607", "PLR2004"]
# The shared fixtures start the repository's tools and `git init` with fixed
# argument vectors and no shell.
"conftest.py" = ["S603", "S607"]
# Native test builds use trusted compiler/Cargo argument vectors without a shell.
"controller_test_support.py" = ["S603", "S607"]
# The gate runner and the publishable-file listing execute fixed argument
# vectors of repository tools and Git without a shell and without untrusted
# input.
"tools/preflight.py" = ["S603", "S607"]
# Native capture builds trusted repository snapshots with fixed argv and no shell.
"tools/capture_native_simulation.py" = ["S603", "S607"]
# AMP execution uses an explicitly admitted absolute simulator with a closed argv, no shell.
"tools/capture_amp_simulation.py" = ["S603"]
# Build provenance introspects explicitly resolved actual compiler/Git/tool programs, no shell.
"tools/amp_build_toolchain.py" = ["S603"]
"tools/write_amp_plugin_manifest.py" = ["S603"]
# Host load executes an explicitly selected absolute executable and owned worker
# with argument vectors, no shell, bounded lifetime and owned process groups.
"tools/linux_load.py" = ["S603"]
# Native comparisons execute trusted repository binaries and fixed tool argv without a shell.
"tools/benchmark_controllers.py" = ["S603", "S607"]
# The site builder invokes only Git with a fixed argument vector to bind source provenance.
"tools/build_docs_site.py" = ["S603", "S607"]
"tools/repository_files.py" = ["S603", "S607"]

[tool.ruff.lint.flake8-copyright]
# The mandated provenance header states both copyright lines this way.
notice-rgx = "© (Concepts|Code) \\d{4}–\\d{4} Miroslav Šotek\\. All rights reserved\\."
min-file-size = 0

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.isort]
known-first-party = [
    "audit_workflows",
    "check_commit_trailers",
    "controller_test_support",
    "check_dependency_licences",
    "check_documentation",
    "check_provenance_headers",
    "generate_capability_inventory",
    "manifest_io",
    "preflight",
    "repository_files",
    "validate_measurement_domain",
]

[tool.ruff.format]
docstring-code-format = true

[tool.mypy]
strict = true
python_version = "3.13"
warn_unreachable = true
extra_checks = true
enable_error_code = [
    "ignore-without-code",
    "redundant-expr",
    "truthy-bool",
    "possibly-undefined",
    "unused-awaitable",
]
mypy_path = ["tools"]
files = ["src", "tools", "tests", "conftest.py", "controller_test_support.py"]
pretty = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
xfail_strict = true
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
source = ["src/loop_timing_witness", "tools", "controller_test_support"]
patch = ["subprocess"]

# Isolated repository contract controls copy these exact maintained sources.
# Subprocess coverage keeps their actual trace under the corresponding source root.
[tool.coverage.paths]
tools = ["tools", "*/repository-contract-control/tools"]
tests = ["tests", "*/repository-contract-control/tests"]
# The control copy also holds the measured root module controller_test_support.py.
repository = [".", "*/repository-contract-control"]

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = false
